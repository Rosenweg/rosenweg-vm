#!/usr/sbin/nft -f
# Firewall des vm-gateway-CT, im Container selbst.
# Einspielen: install -m 0644 nftables.conf /etc/nftables.conf
#             install -m 0644 nft-adressen.beispiel.conf /etc/vm-gateway/nft-adressen.conf
#             (einmal, dann die echten Adressen eintragen)
#             nft -c -f /etc/nftables.conf && systemctl enable --now nftables
#             systemctl reload nftables   # nach Aenderungen
# Siehe README.md, Abschnitt "Firewall".
#
# Der Tunnel selbst braucht diese Regeln nicht (kein Weiterleiten, Netzstapel
# im Prozess). Sie begrenzen, was der CT ueberhaupt annimmt und wohin er darf,
# falls der Dienst oder der CT einmal etwas tut, was er nicht soll.
#
# Die Adressen des Hauses (API, DNS, Proxmox-Knoten, Authentik) stehen NICHT
# hier (oeffentliches Repo), sondern im CT in /etc/vm-gateway/nft-adressen.conf
# (Vorlage: nft-adressen.beispiel.conf). Fehlt die Datei, laedt nft nichts
# (nft -c meldet es), die alte Regelmenge bleibt aktiv.

flush ruleset

# definiert API, DNS, PVE4, PVE6, AUTH4, AUTH6
include "/etc/vm-gateway/nft-adressen.conf"

define WG_PORT  = 51831                              # = GW_WG_PORT, App-Tunnel

table inet vmgw {
	chain ein {
		type filter hook input priority filter; policy drop;

		iif "lo" accept
		ct state established,related accept
		ct state invalid drop

		# IPv6 braucht Nachbarschaft und Router-Anzeigen; Ping zur Diagnose.
		icmpv6 type { nd-neighbor-solicit, nd-neighbor-advert, nd-router-advert, echo-request } accept
		icmp type echo-request limit rate 10/second accept

		udp dport $WG_PORT counter accept                    # App-Tunnel, von ueberall
		ip saddr $API tcp dport 8080 counter accept          # Steuerung nur von der Haupt-API

		counter limit rate 5/minute log prefix "vmgw-ein-weg: " level info
	}

	chain weiter {
		type filter hook forward priority filter; policy drop;
	}

	chain aus {
		type filter hook output priority filter; policy drop;

		oif "lo" accept
		ct state established,related accept

		icmpv6 type { nd-neighbor-solicit, nd-neighbor-advert, nd-router-solicit } accept

		# WireGuard antwortet und initiiert vom eigenen Port aus zu den Apps
		# (wechselnde Adressen, daher kein festes Ziel).
		udp sport $WG_PORT accept

		ip daddr $DNS udp dport 53 accept
		ip daddr $DNS tcp dport 53 accept
		ip daddr $PVE4 tcp dport { 8006, 3128 } accept
		ip6 daddr $PVE6 tcp dport { 8006, 3128 } accept
		ip daddr $AUTH4 tcp dport 443 accept
		ip daddr $API tcp dport 3000 accept                  # Haupt-API: /api/auth/me fuer rw_app_-Tokens
		ip6 daddr $AUTH6 tcp dport 443 accept

		counter limit rate 5/minute log prefix "vmgw-aus-weg: " level info
		reject
	}
}
