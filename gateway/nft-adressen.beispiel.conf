# Adressen fuer nftables.conf des vm-gateway-CT. Im CT als
# /etc/vm-gateway/nft-adressen.conf ablegen und die Beispielwerte (Doku-Bereiche
# 192.0.2.0/24, 2001:db8::/32) durch die echten ersetzen: A/AAAA der Knoten und
# von Authentik, Adresse der Haupt-API, DNS-Server des Servernetzes.
# Aendert sich eine Adresse: Datei anpassen, dann systemctl reload nftables.

define API      = 192.0.2.52                         # Haupt-API (Steuerung 8080, /api/auth/me 3000)
define DNS      = 192.0.2.1                          # DNS-Server des Servernetzes
define PVE4     = { 192.0.2.20, 192.0.2.21, 192.0.2.22 }          # Proxmox-Knoten (A)
define PVE6     = { 2001:db8:9::20, 2001:db8:9::21, 2001:db8:9::22 }  # Proxmox-Knoten (AAAA)
define AUTH4    = 192.0.2.40                         # Authentik (A)
define AUTH6    = 2001:db8:9::40                     # Authentik (AAAA)
