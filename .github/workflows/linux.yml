# Linux-Bau auf einem GitHub-Runner (ubuntu-latest) im Container debian:13,
# nie auf einem eigenen Runner (oeffentliches Repo).
#
# Systempakete (Header fuer GTK, spice-glib, libsecret) ueber apt-get, Go und
# Flutter als feste Versionen mit Pruefsumme, zwischen Laeufen im
# actions/cache (Schluessel: Versionen + Pruefsummen, Lockdateien).
name: Linux

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GO_VERSION: "1.27.4"
  GO_SHA256: 7226736c2339719cda28fbf3a54d71aa63bcefe376e98cef00034268dab24840
  FLUTTER_VERSION: "3.47.5"
  FLUTTER_SHA256: 2132e990f236f8d22e7c6314b29a191a95b10d7cbcfec9b4e2e303d996652cbb

jobs:
  bauen:
    runs-on: ubuntu-latest
    # Debian 13 wie die Stationen (dpkg-shlibdeps, lintian, spice-glib)
    container: debian:13
    timeout-minutes: 60
    steps:
      # vor checkout: mit git holt checkout das Repo samt .git (Stand im Paket)
      - name: Systempakete
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            ca-certificates clang gcc libc6-dev cmake ninja-build pkg-config xz-utils curl unzip git zstd \
            libgtk-3-dev liblzma-dev libstdc++-14-dev \
            libspice-client-glib-2.0-dev libsecret-1-dev libjsoncpp-dev \
            dpkg-dev binutils patchelf librsvg2-bin file lintian >/dev/null

      - uses: actions/checkout@v4

      - name: Werkzeug-Cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/rosenweg-vm-ci
          key: linux-${{ env.GO_SHA256 }}-${{ env.FLUTTER_SHA256 }}-${{ hashFiles('pubspec.lock', '**/go.sum') }}
          restore-keys: linux-${{ env.GO_SHA256 }}-${{ env.FLUTTER_SHA256 }}-

      - name: Go und Flutter (feste Versionen mit Pruefsumme)
        run: |
          set -euo pipefail
          C="$HOME/.cache/rosenweg-vm-ci"; mkdir -p "$C"
          if [ ! -x "$C/go-$GO_VERSION/bin/go" ]; then
            curl -fsSL -o "$C/go.tgz" "https://dl.google.com/go/go$GO_VERSION.linux-amd64.tar.gz"
            echo "$GO_SHA256  $C/go.tgz" | sha256sum -c -
            mkdir -p "$C/go-$GO_VERSION" && tar -xzf "$C/go.tgz" -C "$C/go-$GO_VERSION" --strip-components=1 && rm "$C/go.tgz"
          fi
          if [ ! -x "$C/flutter-$FLUTTER_VERSION/bin/flutter" ]; then
            curl -fsSL -o "$C/flutter.txz" "https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_$FLUTTER_VERSION-stable.tar.xz"
            echo "$FLUTTER_SHA256  $C/flutter.txz" | sha256sum -c -
            mkdir -p "$C/flutter-$FLUTTER_VERSION" && tar -xJf "$C/flutter.txz" -C "$C/flutter-$FLUTTER_VERSION" --strip-components=1 && rm "$C/flutter.txz"
          fi
          git config --global --add safe.directory "$C/flutter-$FLUTTER_VERSION"
          echo "$C/go-$GO_VERSION/bin" >> "$GITHUB_PATH"
          echo "$C/flutter-$FLUTTER_VERSION/bin" >> "$GITHUB_PATH"
          echo "GOPATH=$C/gopath" >> "$GITHUB_ENV"
          echo "GOMODCACHE=$C/gopath/pkg/mod" >> "$GITHUB_ENV"
          echo "GOTOOLCHAIN=local" >> "$GITHUB_ENV"
          echo "PUB_CACHE=$C/pub-cache" >> "$GITHUB_ENV"

      - name: Go-Tests (Tunnel, Gateway)
        run: |
          (cd native/rwtunnel && go vet ./... && go test -count=1 ./...)
          (cd gateway && go vet . && go test -count=1 .)

      - name: Native Bibliotheken
        run: |
          native/rwtunnel/bauen.sh linux
          native/rwspice/bauen.sh linux

      - name: Flutter pruefen und bauen
        run: |
          flutter config --no-analytics --enable-linux-desktop >/dev/null
          flutter pub get
          flutter analyze
          flutter test
          flutter build linux --release

      - name: Gateway bauen
        run: |
          cd gateway
          CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o build/vm-gateway .

      - name: Pakete zusammenstellen
        run: |
          mkdir -p ausgabe
          cp LICENSE LIZENZEN.md build/linux/x64/release/bundle/
          tar -C build/linux/x64/release -czf ausgabe/rosenweg-vm-linux-x64.tar.gz bundle
          cp gateway/build/vm-gateway gateway/vm-gateway.service gateway/setup.sh \
             gateway/nftables.conf gateway/nft-adressen.beispiel.conf ausgabe/

      # Dasselbe .deb wie im Bau-Container (linux/paket/im-container.sh), nur
      # aus dem Buendel dieses Laufs. Die Stationen holen es mit Pruefsumme vom
      # PXE-Server (os-stationen, pakete/rosenweg-vm/); bei Tags geht es zusaetzlich
      # ins GitHub-Release und auf www.rosenweg4303.ch/apps (Job veroeffentlichen).
      - name: Debian-Paket
        run: |
          linux/paket/bauen.sh --nur-paket
          cp linux/paket/out/*.deb ausgabe/

      - uses: actions/upload-artifact@v4
        with:
          name: rosenweg-vm-linux
          path: ausgabe/
          retention-days: 14

  # Bei einem Tag v* (= version in pubspec.yaml): .deb ins GitHub-Release und auf
  # www.rosenweg4303.ch/apps (Anmeldung per GitHub-OIDC, kein Geheimnis). Die Stationen
  # holen das Paket weiterhin mit Pruefsumme vom PXE-Server (os-stationen).
  veroeffentlichen:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: bauen
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: rosenweg-vm-linux
          path: ausgabe

      # Ueber github-script (REST-API), wie rosenweg-salz.
      - name: Release
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const tag = context.ref.replace('refs/tags/', '');
            const repo = { owner: context.repo.owner, repo: context.repo.repo };
            // der macOS-Lauf legt dasselbe Release womoeglich gleichzeitig an
            const finden = () => github.rest.repos.getReleaseByTag({ ...repo, tag });
            let rel;
            try {
              rel = await finden();
            } catch (e) {
              try {
                rel = await github.rest.repos.createRelease({ ...repo, tag_name: tag, name: tag, body: 'Linux (Debian 13) und macOS' });
              } catch (e2) {
                rel = await finden();
              }
            }
            const dateien = fs.readdirSync('ausgabe').filter((f) => f.endsWith('.deb'));
            if (!dateien.length) throw new Error('Kein .deb in ausgabe/');
            for (const f of dateien) {
              // wie 'gh release upload --clobber'
              const alt = rel.data.assets.find((a) => a.name === f);
              if (alt) await github.rest.repos.deleteReleaseAsset({ ...repo, asset_id: alt.id });
              await github.rest.repos.uploadReleaseAsset({
                ...repo, release_id: rel.data.id, name: f,
                data: fs.readFileSync(path.join('ausgabe', f)),
              });
              core.info(`Hochgeladen: ${f}`);
            }

      - uses: Rosenweg/Website/.github/actions/apps-release@main
        with:
          dateien: ausgabe/*.deb
