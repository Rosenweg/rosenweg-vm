# Android-APK auf GitHub-Runnern (ubuntu-latest), nie auf einem eigenen Runner
# (oeffentliches Repo). Muster: rosenweg-salz android.yml und linux.yml hier.
# Flutter, JDK, Android-SDK samt NDK und Go als feste Versionen mit Pruefsumme
# (nicht das vorinstallierte SDK des Runners), zwischen Laeufen im
# actions/cache; Release ueber github-script.
#
# Job "stapel": spice-client-glib samt Abhaengigkeiten fuer arm64-v8a und
# x86_64 (native/spice-stapel/bauen.sh: GStreamer-Binaerpaket fuer GLib,
# OpenSSL & Co., dazu libusb, usbredir, spice-gtk mit dem NDK), dann
# librwspice.so dagegen. Die Quellarchive (u. a. ~1 GB GStreamer-Paket) liegen
# im actions/cache. Braucht keine Secrets.
#
# Job "apk": librwtunnel.so (Go), alle .so nach build/android-jniLibs,
# flutter build apk. rosenweg-basis ist oeffentlich (pub ohne Token). Braucht:
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS,
#   ANDROID_KEY_PASSWORD                  Rosenweg-Signierschluessel (optional,
#                                         nur bei Push auf main / Tag v*; sonst
#                                         und bei jedem PR: Debug-Signatur,
#                                         nicht an /apps)
name: Android

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read   # commons-rosenweg (ch.rosenweg4303:cloud/updater) aus GitHub Packages

env:
  GO_VERSION: "1.27.4"
  GO_SHA256: 7226736c2339719cda28fbf3a54d71aa63bcefe376e98cef00034268dab24840
  FLUTTER_VERSION: "3.47.5"
  FLUTTER_SHA256: 2132e990f236f8d22e7c6314b29a191a95b10d7cbcfec9b4e2e303d996652cbb
  JDK_VERSION: "21.0.13.1+2"
  JDK_SHA256: bb8a93f9ae6e7a693b2b721e85dbeff26ae1a77447985a8d7afcdd9c7cf6222e
  # cmdline-tools 19.0: ab 23.0 ist sdkmanager nur noch ein Verweis auf die neue "android"-CLI
  ANDROID_CMDLINE_TOOLS: "13114758"
  ANDROID_CMDLINE_TOOLS_SHA256: 7ec965280a073311c339e571cd5de778b9975026cfcbe79f2b1cdcb1e15317ee
  NDK_VERSION: "28.2.13676358"
  # Signieren nur bei Push auf main oder Tag v*, nie bei pull_request (dann
  # Debug-Signatur bzw. unsigniert; die Secrets kommen gar nicht in den Job).
  SIGNIEREN: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}

jobs:
  stapel:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, x86_64]
    steps:
      - uses: actions/checkout@v4

      - &systempakete
        name: Systempakete
        run: |
          noetig="meson ninja-build pkg-config python3 python3-pyparsing python3-six \
                  libglib2.0-dev-bin gettext xz-utils curl unzip git openssh-client file"
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends $noetig >/dev/null
          meson --version

      # Werkzeuge (Flutter, JDK, SDK mit NDK, Gradle, Pub; Go) und die
      # Quellarchive des SPICE-Stapels: actions/cache statt Benutzerverzeichnis
      # eines eigenen Runners. Die Pruefsummen gelten beim Laden weiter.
      - &cache
        name: Werkzeug-Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/rosenweg-flutter-ci
            ~/.cache/rosenweg-vm-ci
          key: android-${{ github.job }}-${{ env.FLUTTER_SHA256 }}-${{ env.JDK_SHA256 }}-${{ env.ANDROID_CMDLINE_TOOLS_SHA256 }}-${{ env.NDK_VERSION }}-${{ env.GO_SHA256 }}-${{ hashFiles('native/spice-stapel/versionen.sh', 'native/spice-stapel/bauen.sh', 'pubspec.lock', 'android/**/*.kts', '**/go.sum') }}
          restore-keys: android-${{ github.job }}-${{ env.FLUTTER_SHA256 }}-${{ env.JDK_SHA256 }}-${{ env.ANDROID_CMDLINE_TOOLS_SHA256 }}-${{ env.NDK_VERSION }}-${{ env.GO_SHA256 }}-

      # Flutter, JDK und SDK in denselben Versionen wie rosenweg-salz/rosenweg-basis,
      # Go wie linux.yml hier; dazu das NDK.
      - &werkzeuge
        name: Flutter, JDK, Android-SDK mit NDK, Go (feste Versionen mit Pruefsumme)
        run: |
          set -euo pipefail
          C="$HOME/.cache/rosenweg-flutter-ci"; mkdir -p "$C"
          if [ ! -x "$C/flutter-$FLUTTER_VERSION/bin/flutter" ]; then
            curl -fsSL -o "$C/flutter.txz" "https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_$FLUTTER_VERSION-stable.tar.xz"
            echo "$FLUTTER_SHA256  $C/flutter.txz" | sha256sum -c -
            mkdir -p "$C/flutter-$FLUTTER_VERSION" && tar -xJf "$C/flutter.txz" -C "$C/flutter-$FLUTTER_VERSION" --strip-components=1 && rm "$C/flutter.txz"
          fi
          J="$C/jdk-${JDK_VERSION//+/_}"
          if [ ! -x "$J/bin/java" ]; then
            curl -fsSL -o "$C/jdk.tgz" "https://github.com/adoptium/temurin21-binaries/releases/download/jdk-${JDK_VERSION//+/%2B}/OpenJDK21U-jdk_x64_linux_hotspot_${JDK_VERSION//+/_}.tar.gz"
            echo "$JDK_SHA256  $C/jdk.tgz" | sha256sum -c -
            mkdir -p "$J" && tar -xzf "$C/jdk.tgz" -C "$J" --strip-components=1 && rm "$C/jdk.tgz"
          fi
          A="$C/android-sdk"
          if [ ! -x "$A/cmdline-tools/$ANDROID_CMDLINE_TOOLS/bin/sdkmanager" ]; then
            curl -fsSL -o "$C/ct.zip" "https://dl.google.com/android/repository/commandlinetools-linux-${ANDROID_CMDLINE_TOOLS}_latest.zip"
            echo "$ANDROID_CMDLINE_TOOLS_SHA256  $C/ct.zip" | sha256sum -c -
            rm -rf "$C/ct" && unzip -q "$C/ct.zip" -d "$C/ct" && rm "$C/ct.zip"
            mkdir -p "$A/cmdline-tools"
            rm -rf "$A/cmdline-tools/$ANDROID_CMDLINE_TOOLS" && mv "$C/ct/cmdline-tools" "$A/cmdline-tools/$ANDROID_CMDLINE_TOOLS" && rm -rf "$C/ct"
          fi
          ln -sfn "$ANDROID_CMDLINE_TOOLS" "$A/cmdline-tools/latest"
          sdk() { JAVA_HOME="$J" "$A/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$A" "$@"; }
          (yes || true) | sdk --licenses >/dev/null
          [ -d "$A/platform-tools" ] || sdk "platform-tools" >/dev/null
          [ -x "$A/ndk/$NDK_VERSION/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" ] || sdk "ndk;$NDK_VERSION" >/dev/null
          for d in licenses platform-tools "ndk/$NDK_VERSION"; do
            [ -d "$A/$d" ] || { echo "::error::Android-SDK unvollstaendig: $A/$d fehlt"; exit 1; }
          done
          G="$HOME/.cache/rosenweg-vm-ci"; mkdir -p "$G"
          if [ ! -x "$G/go-$GO_VERSION/bin/go" ]; then
            curl -fsSL -o "$G/go.tgz" "https://dl.google.com/go/go$GO_VERSION.linux-amd64.tar.gz"
            echo "$GO_SHA256  $G/go.tgz" | sha256sum -c -
            mkdir -p "$G/go-$GO_VERSION" && tar -xzf "$G/go.tgz" -C "$G/go-$GO_VERSION" --strip-components=1 && rm "$G/go.tgz"
          fi
          {
            echo "$C/flutter-$FLUTTER_VERSION/bin"
            echo "$J/bin"
            echo "$G/go-$GO_VERSION/bin"
          } >> "$GITHUB_PATH"
          {
            echo "JAVA_HOME=$J"
            echo "ANDROID_HOME=$A"
            echo "ANDROID_SDK_ROOT=$A"
            echo "ANDROID_NDK_HOME=$A/ndk/$NDK_VERSION"
            echo "GRADLE_USER_HOME=$C/gradle"
            echo "GRADLE_OPTS=-Dorg.gradle.daemon=false"
            echo "PUB_CACHE=$C/pub-cache"
            echo "GOPATH=$G/gopath"
            echo "GOMODCACHE=$G/gopath/pkg/mod"
            echo "GOTOOLCHAIN=local"
            # Quellarchive des SPICE-Stapels (~1 GB GStreamer-Paket) bleiben hier liegen
            echo "RW_STAPEL_QUELLEN=$G/spice-stapel-quellen"
          } >> "$GITHUB_ENV"

      - name: SPICE-Stapel
        run: native/spice-stapel/bauen.sh android ${{ matrix.abi }}

      - name: rwspice
        run: native/rwspice/bauen.sh android ${{ matrix.abi }}

      # Ladetest auf dem Emulator waere zu teuer; mindestens: alle Abhaengigkeiten
      # der beiden .so muessen Systembibliotheken von Android sein.
      - name: Abhaengigkeiten pruefen
        run: |
          set -euo pipefail
          rd="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          for f in native/spice-stapel/build/android/${{ matrix.abi }}/libspiceglib.so native/rwspice/build/android/${{ matrix.abi }}/librwspice.so; do
            echo "== $f"; ls -la "$f"
            "$rd" -d "$f" | grep NEEDED
            fremd=$("$rd" -d "$f" | sed -n 's/.*Shared library: \[\(.*\)\]/\1/p' \
              | grep -vE '^(libc|libm|libdl|liblog|libandroid|libspiceglib)\.so$' || true)
            [ -z "$fremd" ] || { echo "::error::$f braucht $fremd (nicht im APK)"; exit 1; }
            "$rd" -lW "$f" | awk '$1=="LOAD" && $NF!="0x4000" {print; bad=1} END {exit bad}' \
              || { echo "::error::$f nicht auf 16-KB-Seiten ausgerichtet"; exit 1; }
          done
          "$rd" --dyn-syms native/rwspice/build/android/${{ matrix.abi }}/librwspice.so | grep -c ' rw_spice_'
          # "Ordner freigeben": spice-glib mit WebDAV-Server (rw_spice_ordner_moeglich sucht dieses Symbol)
          # (phodav ist statisch drin, Symbole verborgen: am GObject-Typnamen erkennen)
          grep -qa 'PhodavServer' native/spice-stapel/build/android/${{ matrix.abi }}/libspiceglib.so \
            || { echo "::error::libspiceglib.so ohne phodav (Ordner freigeben ginge nicht)"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: spice-android-${{ matrix.abi }}
          path: |
            native/spice-stapel/build/android/${{ matrix.abi }}/libspiceglib.so
            native/spice-stapel/build/android/${{ matrix.abi }}/BIBLIOTHEKEN.txt
            native/rwspice/build/android/${{ matrix.abi }}/librwspice.so
          retention-days: 14

  apk:
    needs: stapel
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - *systempakete

      - *cache

      - *werkzeuge

      - uses: actions/download-artifact@v4
        with:
          pattern: spice-android-*
          path: stapel

      - name: Native Bibliotheken sammeln
        run: |
          set -euo pipefail
          native/rwtunnel/bauen.sh android
          for abi in arm64-v8a x86_64; do
            mkdir -p native/spice-stapel/build/android/$abi native/rwspice/build/android/$abi
            cp stapel/spice-android-$abi/spice-stapel/build/android/$abi/* native/spice-stapel/build/android/$abi/
            cp stapel/spice-android-$abi/rwspice/build/android/$abi/librwspice.so native/rwspice/build/android/$abi/
          done
          android/native-sammeln.sh
          cat native/spice-stapel/build/android/*/BIBLIOTHEKEN.txt > ausgabe-bibliotheken.txt

      - name: Flutter pruefen
        run: |
          flutter config --no-analytics >/dev/null
          flutter pub get --enforce-lockfile
          flutter analyze
          flutter test

      - name: Signierschluessel (nur Push auf main / Tag v*)
        if: env.SIGNIEREN == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            (umask 077; printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/rosenweg.jks")
            echo "SIGNING_STORE_FILE=$RUNNER_TEMP/rosenweg.jks" >> "$GITHUB_ENV"
            echo "Signatur: Rosenweg-Schluessel"
          else
            echo "::warning::Kein Rosenweg-Signierschluessel als Secret - APK ist mit dem Debug-Schluessel signiert."
          fi

      - name: APK bauen
        env:
          SIGNING_STORE_PASSWORD: ${{ env.SIGNIEREN == 'true' && secrets.ANDROID_KEYSTORE_PASSWORD || '' }}
          SIGNING_KEY_ALIAS: ${{ env.SIGNIEREN == 'true' && secrets.ANDROID_KEY_ALIAS || '' }}
          SIGNING_KEY_PASSWORD: ${{ env.SIGNIEREN == 'true' && secrets.ANDROID_KEY_PASSWORD || '' }}
          # rosenweg_basis android/build.gradle.kts holt commons-rosenweg aus GitHub
          # Packages; Maven dort verlangt auch fuer oeffentliche Pakete eine Anmeldung.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version: *\([^+ ]*\).*/\1/p' pubspec.yaml)
          if [ "${GITHUB_REF_TYPE}" = tag ] && [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME passt nicht zu version $version in pubspec.yaml"
            exit 1
          fi
          # nur die ABIs mit nativem Stapel (sonst kaeme armeabi-v7a ohne librwspice mit)
          flutter build apk --release --target-platform android-arm64,android-x64
          if [ -n "${SIGNING_STORE_FILE:-}" ]; then
            name="rosenweg-vm-$version.apk"
          else
            name="rosenweg-vm-$version-debug-signiert.apk"
          fi
          mkdir -p ausgabe
          cp build/app/outputs/flutter-apk/app-release.apk "ausgabe/$name"
          cp ausgabe-bibliotheken.txt ausgabe/BIBLIOTHEKEN.txt
          # alle drei Bibliotheken je ABI muessen im APK liegen
          for abi in arm64-v8a x86_64; do
            for so in librwtunnel.so librwspice.so libspiceglib.so; do
              unzip -l "ausgabe/$name" | grep -q "lib/$abi/$so" || { echo "::error::lib/$abi/$so fehlt im APK"; exit 1; }
            done
          done
          (cd ausgabe && sha256sum *.apk > SHA256SUMS)
          cat ausgabe/SHA256SUMS
          ls -la ausgabe

      - name: Schluessel entfernen
        if: always()
        run: rm -f "$RUNNER_TEMP/rosenweg.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: rosenweg-vm-android
          path: ausgabe/
          retention-days: 14

  # Bei einem Tag v*: APK ins GitHub-Release und, wenn mit dem Rosenweg-Schluessel
  # signiert, auf www.rosenweg4303.ch/apps (Anmeldung per GitHub-OIDC, kein Geheimnis).
  veroeffentlichen:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: rosenweg-vm-android
          path: ausgabe

      # Ueber github-script (REST-API), wie rosenweg-salz.
      - name: Release
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const tag = context.ref.replace('refs/tags/', '');
            const repo = { owner: context.repo.owner, repo: context.repo.repo };
            // die anderen Plattformen legen dasselbe Release womoeglich gleichzeitig an
            const finden = () => github.rest.repos.getReleaseByTag({ ...repo, tag });
            let rel;
            try {
              rel = await finden();
            } catch (e) {
              try {
                rel = await github.rest.repos.createRelease({ ...repo, tag_name: tag, name: tag, body: 'Android' });
              } catch (e2) {
                rel = await finden();
              }
            }
            const dateien = fs.readdirSync('ausgabe').filter((f) => f.endsWith('.apk'));
            if (!dateien.length) throw new Error('Keine APK in ausgabe/');
            for (const f of dateien) {
              // wie 'gh release upload --clobber'
              const alt = rel.data.assets.find((a) => a.name === f);
              if (alt) await github.rest.repos.deleteReleaseAsset({ ...repo, asset_id: alt.id });
              await github.rest.repos.uploadReleaseAsset({
                ...repo, release_id: rel.data.id, name: f,
                data: fs.readFileSync(path.join('ausgabe', f)),
              });
              core.info(`Hochgeladen: ${f}`);
            }

      - name: Debug-Bau?
        id: art
        run: |
          if ls ausgabe/*-debug-signiert.apk >/dev/null 2>&1; then
            echo "debug=1" >> "$GITHUB_OUTPUT"
            echo "::warning::Debug-signierte APK - nicht an /apps (Rosenweg-Signierschluessel als Secret fehlt)."
          fi

      - uses: Rosenweg/Website/.github/actions/apps-release@main
        if: steps.art.outputs.debug != '1'
        with:
          dateien: ausgabe/*.apk
          paket: ch.rosenweg4303.vm
